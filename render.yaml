# Constrained hiring-assessment topology: one free web service supervises the
# API plus both durable-job workers. See docs/deployment.md before using this.
services:
  - type: web
    name: careloop-demo-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.cli.run_demo_service
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: CARELOOP_ENVIRONMENT
        value: production
      - key: CARELOOP_DATABASE_URL
        fromDatabase:
          name: careloop-postgres
          property: connectionString
      - key: CARELOOP_JWT_SECRET
        generateValue: true
      - key: CARELOOP_FRONTEND_ORIGIN
        sync: false
      - key: CARELOOP_CORS_ORIGINS
        sync: false
      - key: CARELOOP_PUBLIC_API_URL
        sync: false
      - key: CARELOOP_COOKIE_SAMESITE
        value: lax
      - key: CARELOOP_LLM_ENABLED
        value: "false"
      - key: CARELOOP_LLM_PROVIDER
        sync: false
      - key: CARELOOP_LLM_API_KEY
        sync: false
      - key: CARELOOP_LLM_BASE_URL
        sync: false
      - key: CARELOOP_LLM_MODEL
        sync: false
      - key: CARELOOP_LLM_TIMEOUT_SECONDS
        sync: false
      - key: CARELOOP_EMAIL_DELIVERY_REQUIRED
        value: "false"
      - key: CARELOOP_EMAIL_PROVIDER
        sync: false
      - key: CARELOOP_EMAIL_FROM_ADDRESS
        sync: false
      - key: CARELOOP_EMAIL_TIMEOUT_SECONDS
        sync: false
      - key: CARELOOP_SMTP_HOST
        sync: false
      - key: CARELOOP_SMTP_PORT
        sync: false
      - key: CARELOOP_SMTP_USERNAME
        sync: false
      - key: CARELOOP_SMTP_PASSWORD
        sync: false
      - key: CARELOOP_SMTP_USE_STARTTLS
        sync: false
      - key: CARELOOP_SENDGRID_API_KEY
        sync: false
      - key: CARELOOP_RESEND_API_KEY
        sync: false
      - key: CARELOOP_RESEND_BASE_URL
        sync: false
      - key: CARELOOP_GOOGLE_CALENDAR_ENABLED
        value: "false"
      - key: CARELOOP_GOOGLE_CLIENT_ID
        sync: false
      - key: CARELOOP_GOOGLE_CLIENT_SECRET
        sync: false
      - key: CARELOOP_GOOGLE_REDIRECT_URI
        sync: false
      - key: CARELOOP_GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CARELOOP_GOOGLE_CALENDAR_SCOPES
        sync: false
      - key: CARELOOP_NOTIFICATION_POLL_SECONDS
        sync: false
      - key: CARELOOP_NOTIFICATION_MAX_ATTEMPTS
        sync: false
      - key: CARELOOP_NOTIFICATION_BASE_RETRY_SECONDS
        sync: false
      - key: CARELOOP_NOTIFICATION_STALE_CLAIM_SECONDS
        sync: false

databases:
  - name: careloop-postgres
    plan: free
    postgresMajorVersion: "16"
