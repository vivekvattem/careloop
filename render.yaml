services:
  - type: web
    name: careloop-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: CARELOOP_ENVIRONMENT
        value: production
      - key: CARELOOP_DATABASE_URL
        fromDatabase:
          name: careloop-postgres
          property: connectionString
      - key: CARELOOP_JWT_SECRET
        generateValue: true
      - key: CARELOOP_FRONTEND_ORIGIN
        sync: false
      - key: CARELOOP_CORS_ORIGINS
        sync: false
      - key: CARELOOP_PUBLIC_API_URL
        sync: false
    preDeployCommand: python -m alembic upgrade head

  - type: worker
    name: careloop-notification-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.cli.run_notification_worker
    envVars:
      - key: CARELOOP_ENVIRONMENT
        value: production
      - key: CARELOOP_DATABASE_URL
        fromDatabase:
          name: careloop-postgres
          property: connectionString
      # Set the same strong value as the API service in the Render secret store.
      - key: CARELOOP_JWT_SECRET
        sync: false
      - key: CARELOOP_FRONTEND_ORIGIN
        sync: false

  - type: worker
    name: careloop-calendar-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.cli.run_calendar_worker
    envVars:
      - key: CARELOOP_ENVIRONMENT
        value: production
      - key: CARELOOP_DATABASE_URL
        fromDatabase:
          name: careloop-postgres
          property: connectionString
      # Set the same strong value as the API service in the Render secret store.
      - key: CARELOOP_JWT_SECRET
        sync: false
      - key: CARELOOP_FRONTEND_ORIGIN
        sync: false

  - type: web
    name: careloop-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: careloop-postgres
    plan: basic-256mb
