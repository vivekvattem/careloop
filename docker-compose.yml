services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careloop
      POSTGRES_USER: careloop
      POSTGRES_PASSWORD: careloop-local-only
    ports:
      - "5432:5432"
    volumes:
      - careloop_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careloop -d careloop"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Optional, ignored local simulation values. It intentionally does not read backend/.env.
    env_file:
      - path: ./backend/.env.compose
        required: false
    environment:
      CARELOOP_DATABASE_URL: postgresql+psycopg://careloop:careloop@postgres:5432/careloop
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.cli.run_notification_worker"]
    env_file:
      - path: ./backend/.env.compose
        required: false
    environment:
      CARELOOP_DATABASE_URL: postgresql+psycopg://careloop:careloop@postgres:5432/careloop
    depends_on:
      postgres:
        condition: service_healthy

  calendar-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.cli.run_calendar_worker"]
    env_file:
      - path: ./backend/.env.compose
        required: false
    environment:
      CARELOOP_DATABASE_URL: postgresql+psycopg://careloop:careloop@postgres:5432/careloop
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  careloop_postgres:
