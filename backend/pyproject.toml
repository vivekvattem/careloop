[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careloop-backend"
version = "0.1.0"
description = "CareLoop Phase 1 API"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.1",
    "email-validator==2.2.0",
    "fastapi==0.115.8",
    "psycopg[binary]==3.2.4",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "pyjwt==2.10.1",
    "pwdlib[argon2]==0.2.1",
    "sqlalchemy==2.0.38",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
